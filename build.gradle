plugins {
	id 'java'
	id 'java-library'
	id 'org.springframework.boot' version '3.5.14'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.sofiauni'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

tasks.named('bootJar') {
	enabled = false
}

tasks.named('jar') {
	enabled = true
	archiveClassifier = ''
}

dependencies {
	// --- shipped (library) ---
	api 'net.ttddyy:datasource-proxy:1.10'
	implementation 'org.springframework.boot:spring-boot-autoconfigure'
	implementation 'org.slf4j:slf4j-api'
	compileOnly 'org.springframework:spring-web'
	compileOnly 'jakarta.servlet:jakarta.servlet-api'
	compileOnly 'io.micrometer:micrometer-core'
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
	annotationProcessor 'org.projectlombok:lombok'

	// --- demo + tests (not shipped) ---
	testImplementation 'org.springframework.boot:spring-boot-starter-web'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	testImplementation 'org.springframework.boot:spring-boot-starter-actuator'
	testImplementation 'io.micrometer:micrometer-core'
	testRuntimeOnly 'org.postgresql:postgresql'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:junit-jupiter'
	testImplementation 'org.testcontainers:postgresql'
	testCompileOnly 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}

// Run the demo (src/test) with a Testcontainers-managed PostgreSQL via: ./gradlew bootTestRun
tasks.named('bootTestRun') {
	mainClass = 'com.sofiauni.sqlanalyzer.TestSqlanalyzerApplication'
}
